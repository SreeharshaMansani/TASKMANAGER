name: n8n AI Test Runner
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Tests
        run: |
          npm test || pytest > results.log 2>&1
      - name: Send Result to n8n
        run: |
          curl -X POST -d @results.log https://your-n8n-webhook-url.com
